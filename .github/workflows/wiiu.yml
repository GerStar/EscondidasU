name: Build Wii U RPX

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix pacman mirrors and install WUT
        run: |
          mkdir -p /etc/pacman.d
          echo -e "User-Agent: Wget\n" > /etc/pacman.d/wget.conf
          sed -i 's/XferCommand = \/usr\/bin\/curl/XferCommand = \/usr\/bin\/wget --config=\/etc\/pacman.d\/wget.conf/g' /etc/pacman.conf
          dkp-pacman -Sy --noconfirm wiiu-dev

      - name: Build project
        run: |
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscondidasU-RPX
          path: |
            build/*.rpx
            build/*.wuhb
